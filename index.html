<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Beautiful Dark Twisted Fantasy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">My Beautiful Dark Twisted Fantasy</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "My Beautiful Dark Twisted Fantasy",
  cover: "mbdtfcover.jpg",
  songs: [
    { 
      file: "sweatonmyface.mp3", 
      title: "Sweat On My Face", 
      artist: "Kanye West, Talib Kweli, Consequence, Mos Def" 
    },
    { 
      file: "pure.mp3", 
      title: "Pure", 
      artist: "Kanye West, Mr. Hudson" 
    },
    { 
      file: "hellofalife.mp3", 
      title: "Hell Of A Life", 
      artist: "Kanye West, Bon Iver" 
    },

    {
      title: "Higher",
      versions: [
        {
          version: "V6",
          file: "higherv6.mp3",
          artist: "Kanye West, Nicki Minaj, Bon Iver"
        },
        {
          version: "V1",
          file: "higher.mp3",
          artist: "Kanye West"
        }
      ]
    },

    {
      title: "All Of The Lights",
      versions: [
        {
          version: "V31",
          file: "allofthelightsv31.mp3",
          artist: "Kanye West, Drake, Charlie Wilson"
        },
        {
          version: "V24",
          file: "ghettouniversityv24.mp3",
          artist: "Kanye West, Charlie Wilson, The WRLDFMS Tony Williams, John Legend"
        }
      ]
    },

    { 
      file: "mamasboyv11.mp3", 
      title: "Mamas Boy", 
      artist: "Kanye West" 
    },
    { 
      file: "christmasinharlem.mp3", 
      title: "Christmas In Harlem", 
      artist: "Kanye West, Teyena Taylor, CyHi the Prynce" 
    }
  ]
};


// BACK BUTTON
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/";
}


// VARIABLES
let currentIndex = 0;
let currentVersionIndex = null;


// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;


// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // Prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach((version, versionIndex) => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            currentIndex = i;
            currentVersionIndex = versionIndex;

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);
        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);
    }

  });
}


// PLAY SONG
function playSong(i, versionIndex = null) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  // VERSION GROUP
  if (song.versions) {

    // When autoplay first reaches this group,
    // start with the LOWEST-numbered version.
    if (versionIndex === null) {
      versionIndex = song.versions.length - 1;
    }

    currentVersionIndex = versionIndex;

    const version = song.versions[versionIndex];

    window.audio.src = version.file;

    window.audio.play();

    updateMediaSession({
      title: song.title,
      artist: version.artist
    });

    return;
  }

  // NORMAL SONG
  currentVersionIndex = null;

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song);
}

// MEDIA SESSION
function updateMediaSession(song) {

  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      {
        src: currentAlbum.cover,
        sizes: "512x512",
        type: "image/jpeg"
      }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    window.audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    window.audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {

    if (!currentAlbum) return;

    // If currently playing a version, go to the previous version
    if (
      currentVersionIndex !== null &&
      currentVersionIndex > 0
    ) {
      playSong(currentIndex, currentVersionIndex - 1);
      return;
    }

    // Otherwise go to previous album track
    if (currentIndex > 0) {
      playSong(currentIndex - 1);
    } else {
      playSong(currentAlbum.songs.length - 1);
    }
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];

    // If playing a version, go to the next version
    if (
      song.versions &&
      currentVersionIndex !== null &&
      currentVersionIndex < song.versions.length - 1
    ) {
      playSong(currentIndex, currentVersionIndex + 1);
      return;
    }

    // Otherwise go to next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playSong(0);
    }
  });
}


// PLAY / PAUSE BUTTON
function togglePlay() {

  if (window.audio.paused) {
    window.audio.play();
  } else {
    window.audio.pause();
  }
}


// INITIALIZE AUDIO
window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  // Make audio available to the rest of the script
  window.audio = audio;


  // PLAY BUTTON UI
  audio.addEventListener("play", () => {
    document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
  });


  // PAUSE BUTTON UI
  audio.addEventListener("pause", () => {
    document.getElementById("playPauseBtn").innerText = "▶️ Play";
  });


  // AUTOPLAY THROUGH ALBUM
audio.addEventListener("ended", () => {

  if (!currentAlbum) return;

  const song = currentAlbum.songs[currentIndex];

  // VERSION GROUP
  if (
    song.versions &&
    currentVersionIndex !== null
  ) {

    // V1 (index 1) → V6 (index 0)
    if (currentVersionIndex > 0) {

      currentVersionIndex--;

      const version = song.versions[currentVersionIndex];

      window.audio.src = version.file;

      window.audio.play();

      updateMediaSession({
        title: song.title,
        artist: version.artist
      });

      return;
    }

    // Versions are completely finished
    currentVersionIndex = null;
  }

  // NEXT ALBUM SONG
  if (currentIndex < currentAlbum.songs.length - 1) {

    playSong(currentIndex + 1);

  } else {

    // Album finished → restart
    playSong(0);

  }

});


  // BUILD THE SONG LIST
  buildSongs();

});

</script>

</body>
</html>
