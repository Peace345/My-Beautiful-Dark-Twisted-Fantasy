<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Beautiful Dark Twisted Fantasy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Album Title</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "My Beautiful Dark Twisted Fantasy",
  cover: "mbdtfcover.jpg",
  songs: [
      { file: "sweatonmyface.mp3", title: "Sweat On My Face", artist: "Kanye West, Talib Kweli, Consequence, Mos Def" },
      { file: "pure.mp3", title: "Pure", artist: "Kanye West, Mr. Hudson" },
      { file: "hellofalife.mp3", title: "Hell Of A Life", artist: "Kanye West, Bon Iver" },
      {
        title: "Higher",
        versions: [
      {
        version: "V1",
        file: "higher.mp3",
        artist: "Kanye West"
      },
      {
        version: "V6",
        file: "higherv6.mp3",
        artist: "Kanye West, Nicki Minaj, Bon Iver"
      }
    ]
  },
      { file: "ghettouniversityv24.mp3", title: "Ghetto University", artist: "Kanye West, Charlie Wilson, Tony Williams, John Legend" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach(version => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);

        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);

    }

  });

}

// PLAY SONG
function playSong(i) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
    if (!currentAlbum) return;

    const nextIndex = currentIndex + 1;

    if (nextIndex < currentAlbum.songs.length) {
      playSong(nextIndex);
    } else {
      playSong(0);
    }
  });

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});
  
</script>

</body>
</html>
